databases:
  - name: ekambi-hardware-db
    plan: free
    databaseName: ekambi_hardware
    user: ekambi

services:
  - type: web
    name: ekambi-hardware
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ekambi-hardware-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
